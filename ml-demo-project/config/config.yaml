# =============================================================
#  ML 项目配置文件
# =============================================================

project:
  name: "california-housing"
  version: "1.0.0"
  description: "加州房价预测 - ML 全流程 Demo"

# 数据处理
data:
  dataset: "california_housing"
  test_size: 0.2
  random_state: 42
  # 特征工程
  feature_engineering:
    - name: "income_rooms_interaction"
      type: "interaction"
      features: ["MedInc", "AveRooms"]
    - name: "location_cluster"
      type: "polynomial"
      features: ["Latitude", "Longitude"]
      degree: 2
    - name: "bedroom_ratio"
      type: "custom"
      expression: "AveBedrms / AveRooms"

# 模型训练
training:
  # 候选模型
  models:
    - name: "random_forest"
      type: "RandomForestRegressor"
      params:
        n_estimators: 200
        max_depth: 15
        min_samples_split: 5
        min_samples_leaf: 2
        random_state: 42
        n_jobs: -1

    - name: "lightgbm"
      type: "LGBMRegressor"
      params:
        n_estimators: 300
        learning_rate: 0.05
        max_depth: 8
        num_leaves: 31
        subsample: 0.8
        colsample_bytree: 0.8
        random_state: 42
        verbose: -1

    - name: "xgboost"
      type: "XGBRegressor"
      params:
        n_estimators: 300
        learning_rate: 0.05
        max_depth: 8
        subsample: 0.8
        colsample_bytree: 0.8
        random_state: 42
        verbosity: 0

  # 超参数优化
  hyperparameter_tuning:
    enabled: true
    n_trials: 50
    timeout: 300  # 秒
    metric: "rmse"
    direction: "minimize"

  # 交叉验证
  cross_validation:
    n_splits: 5
    shuffle: true
    random_state: 42

# 模型评估
evaluation:
  metrics:
    - "mae"
    - "rmse"
    - "r2"
    - "mape"
  # 模型注册阈值（新模型必须优于旧模型才能上线）
  promotion_thresholds:
    rmse_improvement: 0.01  # RMSE 至少改善 1%
    r2_minimum: 0.75

# 模型服务
serving:
  host: "0.0.0.0"
  port: 8000
  workers: 2
  # 预测配置
  prediction:
    batch_size: 100
    timeout_seconds: 30
  # 缓存
  cache:
    enabled: true
    ttl_seconds: 300

# 监控
monitoring:
  # 数据漂移检测
  drift_detection:
    enabled: true
    check_interval_hours: 24
    # PSI 阈值
    psi_warning: 0.1
    psi_critical: 0.2
    # KS 检验阈值
    ks_threshold: 0.05
  # 性能监控
  performance:
    # 预测延迟告警阈值 (ms)
    latency_warning_ms: 50
    latency_critical_ms: 100
  # 自动重训练
  auto_retrain:
    enabled: true
    trigger_conditions:
      - "drift_detected"
      - "performance_degradation"
      - "scheduled"
    schedule_cron: "0 2 * * 0"  # 每周日凌晨2点

# MLflow 配置
mlflow:
  tracking_uri: "http://mlflow:5000"
  experiment_name: "california-housing"
  # 模型注册
  register_model: true
  model_name: "california_housing_model"
