# Staging 层：订单明细 schema 配置与测试
version: 2

models:
  - name: stg_order_items
    description: "订单明细 - 从原始数据清洗并计算小计"
    columns:
      - name: order_item_id
        description: "订单项唯一标识"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "订单ID"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        description: "产品ID"
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: quantity
        description: "购买数量"
        tests:
          - not_null
      - name: subtotal_usd
        description: "小计金额（美元）"
        tests:
          - not_null
