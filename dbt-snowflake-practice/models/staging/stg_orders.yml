# Staging 层：订单数据 schema 配置与测试
version: 2

models:
  - name: stg_orders
    description: "订单数据 - 从原始数据清洗并转换金额"
    columns:
      - name: order_id
        description: "订单唯一标识"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "客户ID"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_date
        description: "订单日期"
        tests:
          - not_null
      - name: status
        description: "订单状态 (completed, returned, placed)"
        tests:
          - not_null
          - accepted_values:
              values: ['completed', 'returned', 'placed']
      - name: amount_usd
        description: "订单金额（美元）"
        tests:
          - not_null
