version: '3.8'

services:
  selection-agent:
    build: .
    container_name: selection-agent
    ports:
      - "8000:8000"
    environment:
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./data:/app/data
      - selection_db:/app/db
    restart: unless-stopped

volumes:
  selection_db:
